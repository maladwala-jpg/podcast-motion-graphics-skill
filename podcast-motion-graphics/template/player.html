<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/theme.css"></head>
<body><div id="stage"><div id="bg"></div><div id="grid"></div><div id="vig"></div><div id="cam"><div id="amb"></div><div id="content"></div></div><div id="caps"></div><div id="trans"></div></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="js/icons.js"></script><script src="data/scenes.js"></script><script src="js/lib.js"></script><script src="js/recipes.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const root = document.documentElement.style;
  root.setProperty('--sw', window.PROJECT.width + 'px'); root.setProperty('--sh', window.PROJECT.height + 'px');
  // scene files are discovered by build_data.py (every scenes/*.js)
  for (const f of window.SCENE_FILES || []) {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = () => rej(new Error('cannot load ' + f)); document.head.appendChild(s); });
  }
  await window.initScene(q.get('s'), { nocaps: q.get('nocaps') === '1', notrans: q.get('notrans') === '1' });
})().catch(e => { window.__err = String(e && e.stack || e); console.error(e); });
</script></body></html>
